version: "3.8"

services:
  validacion-formularios:
    image: nginx:alpine
    container_name: validacion-formularios
    restart: always

    volumes:
      - ./:/usr/share/nginx/html:ro

    expose:
      - "80"

    environment:
      VIRTUAL_HOST: validacion.docker.sulbaranjc.com
      VIRTUAL_PORT: "80"

    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
